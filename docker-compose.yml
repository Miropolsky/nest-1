services:
  postgres:
    image: postgres:16
    container_name: nest-1-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: nestuser
      POSTGRES_PASSWORD: nestpass
      POSTGRES_DB: nest1
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
