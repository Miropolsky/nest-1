services:
  postgres:
    image: postgres:16
    container_name: nest-1-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: nestuser
      POSTGRES_PASSWORD: nestpass
      POSTGRES_DB: nest1
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    container_name: nest-1-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: nestuser
      MINIO_ROOT_PASSWORD: nestpass
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
